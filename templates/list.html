<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>导航页</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #2c3e50, #4a6580);
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            background: rgba(255, 255, 255, 0.97);
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.25);
            overflow: hidden;
            padding: 40px;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #2c3e50;
            font-size: 2.8rem;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #2c3e50, #4a6580);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: #666;
            font-size: 1.2rem;
            max-width: 700px;
            margin: 0 auto;
            line-height: 1.6;
        }

        .nav-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .nav-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
            height: 100%;
            border-left: 5px solid #4a6580;
        }

        .nav-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(74, 101, 128, 0.3);
        }

        .card-header {
            padding: 25px 25px 15px;
            text-align: center;
            background: linear-gradient(to right, rgba(74, 101, 128, 0.1), transparent);
        }

        .card-icon {
            font-size: 2.5rem;
            margin-bottom: 15px;
            color: #4a6580;
        }

        .card-title {
            font-size: 1.4rem;
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .card-desc {
            color: #777;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .card-body {
            padding: 0 25px 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .nav-link {
            display: block;
            margin-top: auto;
            background: linear-gradient(135deg, #2c3e50, #4a6580);
            color: white;
            text-align: center;
            padding: 12px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .nav-link:hover {
            background: linear-gradient(135deg, #3a506b, #5b789c);
            box-shadow: 0 5px 15px rgba(44, 62, 80, 0.4);
        }

        .system-info {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 25px;
            margin-top: 40px;
            border-left: 5px solid #4a6580;
        }

        .system-info h2 {
            color: #2c3e50;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #ddd;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .stat-item {
            text-align: center;
            padding: 15px;
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: 700;
            color: #4a6580;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #666;
            font-size: 0.9rem;
        }

        footer {
            text-align: center;
            margin-top: 60px;
            color: white;
            font-size: 0.95rem;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 10px;
        }

        .footer-links a {
            color: white;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .footer-links a:hover {
            color: #ffd43b;
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .nav-grid {
                grid-template-columns: 1fr;
                max-width: 500px;
                margin: 0 auto;
            }

            h1 {
                font-size: 2.2rem;
            }

            .container {
                padding: 25px;
            }

            .stats {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>导航页</h1>
<!--            <p class="subtitle">高效、便捷的面单处理与追踪解决方案，助力物流管理智能化</p>-->
        </header>

        <div class="nav-grid">
            <div class="nav-card">
                <div class="card-header">
                    <div class="card-icon">
                        <i class="fas fa-barcode"></i>
                    </div>
                    <h3 class="card-title">面单条码打印</h3>
                </div>
                <div class="card-body">
                    <a href="/dayin" class="nav-link">进入打印系统</a>
                </div>
            </div>

            <div class="nav-card">
                <div class="card-header">
                    <div class="card-icon">
                        <i class="fas fa-object-group"></i>
                    </div>
                    <h3 class="card-title">面单条码合成</h3>
                </div>
                <div class="card-body">
                    <a href="/hecheng" class="nav-link">进入合成系统</a>
                </div>
            </div>

            <div class="nav-card">
                <div class="card-header">
                    <div class="card-icon">
                        <i class="fas fa-search-location"></i>
                    </div>
                    <h3 class="card-title">追踪标打印</h3>
                </div>
                <div class="card-body">
                    <a href="/zhuizong" class="nav-link">进入追踪系统</a>
                </div>
            </div>

            <div class="nav-card">
                <div class="card-header">
                    <div class="card-icon">
                        <i class="fas fa-chart-bar"></i>
                    </div>
                    <h3 class="card-title">打印数据统计</h3>
                </div>
                <div class="card-body">
                    <a href="/shujuchaxun" class="nav-link">查看数据统计</a>
                </div>
            </div>

            <div class="nav-card">
                <div class="card-header">
                    <div class="card-icon">
                        <i class="fas fa-vial"></i>
                    </div>
                    <h3 class="card-title">企业微信测试群</h3>
                </div>
                <div class="card-body">
                    <a href="/send_qyweixin1" class="nav-link">发送测试消息</a>
                </div>
            </div>

            <div class="nav-card">
                <div class="card-header">
                    <div class="card-icon">
                        <i class="fas fa-bell"></i>
                    </div>
                    <h3 class="card-title">企业微信通知群</h3>
                </div>
                <div class="card-body">
                    <a href="/send_qyweixin2" class="nav-link">发送通知消息</a>
                </div>
            </div>
        </div>

    </div>


    <script>
        // 添加简单的交互效果
        document.addEventListener('DOMContentLoaded', function() {
            const cards = document.querySelectorAll('.nav-card');

            cards.forEach((card, index) => {
                // 添加延迟显示动画
                card.style.animation = `fadeIn 0.5s ease ${index * 0.1}s forwards`;
                card.style.opacity = 0;

                // 添加点击效果
                card.addEventListener('click', function() {
                    this.style.transform = 'scale(0.98)';
                    setTimeout(() => {
                        this.style.transform = '';
                    }, 200);
                });
            });

            // 添加键盘导航支持
            document.addEventListener('keydown', function(e) {
                if (e.key === '1') window.location.href = '/dayin';
                if (e.key === '2') window.location.href = '/hecheng';
                if (e.key === '3') window.location.href = '/zhuizong';
                if (e.key === '4') window.location.href = '/shujuchaxun';
                if (e.key === '5') window.location.href = '/send_qyweixin1';
                if (e.key === '6') window.location.href = '/send_qyweixin2';
            });
        });
    </script>
</body>
</html>

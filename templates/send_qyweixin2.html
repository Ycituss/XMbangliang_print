<body>

	<div class="div_wrapper">
		<h2>企业微信2</h2>

		<div style="display:block; margin-top: 0.5em;">
		文件类型:

		<form action = "" method = "get" style="display: inline; width: auto;">
			<select name="filename" onchange="window.location=this.value">
					<option value="send_qyweixin1">企业微信1</option>
					<option value="send_qyweixin2" selected="selected">企业微信2</option>
			</select>
		</form>
		</div>

		<div class="div_mc_ver">
			<h3 class="h_mc_ver">
				<li style="width: 200px; height: 50px;" id="bu22">
					<a aria-label="Okra">
						<span data-translate="Okra">
							打开文件
							<input type="file" id="fileInput" style="opacity:0;width:200px;height:50px;cursor:pointer;">
						</span>
					</a>
				</li>
			</h3>
		</div>

	</div> <!-- wrapper -->

</body>

<script>
			function add_new_EventListener() {
				const fileInput = document.getElementById('fileInput');
				fileInput.addEventListener('input', async function () {
				if (fileInput.files.length > 0) {
					const response = await uploadFile();
				}
				});

				async function uploadFile() {
				const file = fileInput.files[0];
				if (!file) {
					return '请选择文件';
				}
				const formData = new FormData();
				formData.append('file', file);
				const response = await fetch('/upload_send_qyweixin2', {
					method: 'POST',
					body: formData
				});
				return await response.text();
				}
			}
			add_new_EventListener();
		 </script>
